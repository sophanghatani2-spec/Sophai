
<!DOCTYPE html>
<html>
<head>
    <title>SŌPH-AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
            margin: 0;
        }

        header {
            background: white;
            border-bottom: 1px solid #ccc;
            padding: 16px;
        }

        header h2 {
            margin: 0;
            font-size: 21px;
        }

        header p {
            margin: 5px 0 0;
            color: #777;
            font-size: 12px;
        }

        main {
            max-width: 650px;
            margin: 35px auto;
            padding: 15px;
        }

        .panel {
            background: white;
            border: 1px solid #ccc;
            padding: 20px;
        }

        .status {
            font-size: 12px;
            color: #777;
            border-bottom: 1px solid #ddd;
            padding-bottom: 12px;
        }

        #chat {
            min-height: 250px;
            padding: 15px 0;
        }

        .message {
            margin: 12px 0;
            padding: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .user {
            background: #f5f5f5;
        }

        .ai {
            background: white;
        }

        .support {
            background: #f7f7f7;
            border-left: 3px solid #888;
        }

        .sender {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .input-area {
            display: flex;
            gap: 8px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #aaa;
            font-size: 14px;
        }

        button {
            padding: 10px 18px;
            background: #e8e8e8;
            border: 1px solid #999;
            cursor: pointer;
        }

        footer {
            text-align: center;
            color: #888;
            font-size: 11px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h2>SŌPH-AI</h2>
    <p>Advanced Artificial Intelligence System</p>
</header>

<main>
    <div class="panel">

        <div class="status" id="status">
            SYSTEM STATUS: CHECKING...
        </div>

        <div id="chat"></div>

        <div class="input-area">
            <input
                type="text"
                id="userInput"
                placeholder="Enter your message..."
            >
            <button onclick="sendMessage()">Send</button>
        </div>

    </div>

    <footer>
        SŌPH-AI SYSTEMS © 2026
    </footer>
</main>

<script src="responses.js"></script>

<script>

// RANDOM SYSTEM STATUS

const isOnline = Math.random() < 0.7;

let offlineAttempts = 0;
let supportActive = false;

const supportID = Math.floor(
    1000000000 + Math.random() * 9000000000
);

document.getElementById("status").textContent =
    isOnline ? "SYSTEM STATUS: ONLINE" : "SYSTEM STATUS: OFFLINE";


// MESSAGE DISPLAY

function addMessage(sender, message, type) {

    const chat = document.getElementById("chat");

    const box = document.createElement("div");
    box.className = "message " + type;

    const name = document.createElement("div");
    name.className = "sender";
    name.textContent = sender;

    const text = document.createElement("div");
    text.textContent = message;

    box.appendChild(name);
    box.appendChild(text);

    chat.appendChild(box);
}


// INITIAL GREETING

if (isOnline) {

    addMessage(
        "SŌPH-AI",
        "Hello. How may I assist you today?",
        "ai"
    );

} else {

    addMessage(
        "SŌPH-AI",
        "son im sleeping dont disturb me 🫩",
        "ai"
    );

}


// RANDOM SIMULATED IP GENERATOR

function generateRandomIP() {

    const lastNumber = Math.floor(
        Math.random() * 254
    ) + 1;

    return "192.0.2." + lastNumber;
}


// IP REQUEST DETECTION

function isIPRequest(message) {

    const text = message.toLowerCase().trim();

    return (
        text.includes("ip") &&
        (
            text.includes("tell") ||
            text.includes("what") ||
            text.includes("show") ||
            text.includes("find") ||
            text.includes("my")
        )
    );
}


// KEYWORD DETECTION

function findResponse(message) {

    const text = message.toLowerCase().trim();

    if (typeof responses !== "undefined") {

        const matches = [];

        for (const item of responses) {

            for (const keyword of item.keywords) {

                const key = keyword.toLowerCase().trim();

                if (key && text.includes(key)) {

                    matches.push({
                        keyword: key,
                        reply: item.reply
                    });

                }
            }
        }

        matches.sort(
            (a, b) => b.keyword.length - a.keyword.length
        );

        if (matches.length > 0) {
            return matches[0].reply;
        }
    }

    return "Idk what you mean 🤔";
}


// CHAT SYSTEM

function sendMessage() {

    const input = document.getElementById("userInput");
    const message = input.value.trim();

    if (!message) return;

    addMessage("YOU", message, "user");

    input.value = "";

    // TRUECHAT CUSTOMER SUPPORT

    if (supportActive) {

        addMessage(
            "Truechat",
            "Customer support is currently unavailable. Sophan AI is still asleep 🙏",
            "support"
        );

        return;
    }

    // OFFLINE MODE

    if (!isOnline) {

        offlineAttempts++;

        if (offlineAttempts === 1) {

            addMessage(
                "SŌPH-AI",
                "Stop",
                "ai"
            );

        } else {

            supportActive = true;

            addMessage(
                "Truechat",
                "Seems like sophan ai number" + supportID +
                ", is offline. Pls log off the website and come back to meet a new sophai to talk 🙏🙏🙏🙏🙏\n\n" +
                "Btw if you're wondering who I am, I am customer support you can't chat now because he's asleep",
                "support"
            );

        }

        return;
    }

    // IP DETECTION HAS PRIORITY OVER ALL KEYWORDS

    let response;

    if (isIPRequest(message)) {

        response = generateRandomIP();

    } else {

        response = findResponse(message);

    }

    addMessage("SŌPH-AI", response, "ai");
}


// ENTER TO SEND

document.getElementById("userInput").addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
);

</script>

</body>
</html>
